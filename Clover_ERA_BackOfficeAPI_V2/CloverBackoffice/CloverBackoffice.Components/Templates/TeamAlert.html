<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>RRIDA – Team alert</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:20px 0; background-color: #f4f4f4;">
    <tr>
        <td align="center">

        <!-- Email Container -->
        <table width="100%" cellpadding="0" cellspacing="0"
               style="max-width:500px; background-color:#ffffff; border-radius:8px; box-shadow:0px 4px 10px rgba(0,0,0,0.1);">

            <!-- Logo -->
            <tr>
                <td align="center" style="padding:15px;">
                    <img src="https://app-rrida-api-dev.azurewebsites.net/images/Ridda_logo.png"
                         alt="RRIDA Logo"
                         width="150"
                         style="display:block; max-width:100%; height:auto;">
                </td>
            </tr>

            <!-- Body -->
            <tr>
                <td style="padding:20px; text-align:left;">

                    <p style="color:#333333; font-size:16px; margin-top:0;">
                        Dear Team Manager,
                    </p>

                    <p style="color:#666666; font-size:16px; line-height:1.6;">
                        {{alertSentence}}
                    </p>

                    <p style="color:#666666; font-size:16px; line-height:1.6;">
                        {{encouragement}}
                    </p>

                    <p style="color:#666666; font-size:16px; line-height:1.6; margin-top:20px;">
                        {{linkIntro}}
                        <a href="{{actionLink}}" style="text-decoration: underline;">
                            {{linkLabel}}
                        </a>
                    </p>

                    <p style="color:#333333; font-size:16px; margin-top:30px;">
                        Regards,<br>
                        <strong>RRIDA Team</strong>
                    </p>

                </td>
            </tr>

            <!-- Footer -->
            <tr>
                <td align="center"
                    style="font-size:14px; color:#888888; padding:15px; border-top:1px solid #dddddd;">
                    <p style="margin:5px 0;">
                        &copy; 2026 RRIDA. All Rights Reserved.
                    </p>
                    <p style="margin:5px 0;">
                        <a href="https://www.rrida.com" style="color:#888888; text-decoration:none;">Visit our website</a> |
                        <a href="mailto:support@rrida.com" style="color:#888888; text-decoration:none;">Contact Support</a>
                    </p>
                </td>
            </tr>

        </table>
        <!-- End Email Content -->

    </td>
</tr>
</table>

</body>
</html>
